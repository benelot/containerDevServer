---
all:
  hosts:
    localhost:
      ansible_connection: local
  vars:
    # ── Docker ────────────────────────────────────────────────────────────────
    # Move Docker storage to a dedicated disk to keep the OS disk lean.
    docker_data_root: /var/lib/docker

    # Users added to the docker group (and mamba_users inherits this list).
    docker_users:
      - "{{ ansible_user_id }}"

    # ── Mamba ─────────────────────────────────────────────────────────────────
    # Install prefix for Miniforge3. Shared by all users on the machine.
    # mamba_prefix: /opt/miniforge3

    # ── Proxy ─────────────────────────────────────────────────────────────────
    # Leave blank (or remove) to skip all proxy configuration.
    # http_proxy: "http://proxy.company.com:3128"
    # https_proxy: "http://proxy.company.com:3128"
    # no_proxy: "localhost,127.0.0.1,::1,10.0.0.0/8"
