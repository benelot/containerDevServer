---
all:
  hosts:
    localhost:
      ansible_connection: local
  vars:
    # Override docker_data_root to move Docker storage to a dedicated disk.
    # e.g. docker_data_root: /data/docker
    docker_data_root: /var/lib/docker

    # Users to add to the docker group (no-sudo Docker access).
    docker_users:
      - "{{ ansible_user_id }}"
