services:
  vscode:
    image: codercom/code-server:latest
    restart: unless-stopped
    ports:
      - "${VSCODE_PORT:-4000}:8080"
    environment:
      PASSWORD: "${VSCODE_PASSWORD:-changeme}"
    volumes:
      - "${VSCODE_WORKSPACE:-/home/coder/workspace}:/home/coder/workspace"
      - vscode_config:/home/coder/.config

volumes:
  vscode_config:
