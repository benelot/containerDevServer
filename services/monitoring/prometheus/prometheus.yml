global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:

  # ── Internal exporters ───────────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # ── GPU (active only when dcgm_exporter container is running) ────────────────
  - job_name: dcgm
    static_configs:
      - targets: ['dcgm_exporter:9400']

  # ── Service health probes via blackbox_exporter ──────────────────────────────
  - job_name: service_health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          # MLflow stack
          - http://host.docker.internal:5000/health
          - http://host.docker.internal:9000/minio/health/live
          # DVC stack
          - http://host.docker.internal:9010/minio/health/live
          # Label Studio
          - http://host.docker.internal:8080
          # JupyterLab
          - http://host.docker.internal:8888
          # Dagster
          - http://host.docker.internal:3000/server_info
          # Evidently
          - http://host.docker.internal:8001/health
          # BentoML
          - http://host.docker.internal:3001/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115
