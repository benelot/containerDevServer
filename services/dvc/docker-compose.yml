services:

  # ── MinIO: S3-compatible DVC remote ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
    ports:
      - "${MINIO_API_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── One-shot: create the DVC cache bucket ───────────────────────────────────
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: "http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin_secret}@minio:9000"
      MINIO_BUCKET: ${MINIO_BUCKET:-dvc-cache}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mc mb --ignore-existing local/$$MINIO_BUCKET && echo \"Bucket $$MINIO_BUCKET ready\""
    restart: "no"

volumes:
  minio_data:
