services:

  # ── BentoML model serving ────────────────────────────────────────────────────
  # Loads the Production model from the MLflow registry on startup.
  # Register a model first: mlflow.register_model(...) and transition to Production.
  bentoml:
    build: .
    ports:
      - "${BENTOML_PORT:-3001}:3000"
    environment:
      MLFLOW_TRACKING_URI:    "${MLFLOW_TRACKING_URI:-http://host.docker.internal:5000}"
      MLFLOW_S3_ENDPOINT_URL: "${MLFLOW_S3_ENDPOINT_URL:-http://host.docker.internal:9000}"
      AWS_ACCESS_KEY_ID:      "${MINIO_ROOT_USER:-minioadmin}"
      AWS_SECRET_ACCESS_KEY:  "${MINIO_ROOT_PASSWORD:-minioadmin_secret}"
      MLFLOW_MODEL_NAME:      "${MLFLOW_MODEL_NAME:-mnist1d-conv1d}"
      MLFLOW_MODEL_STAGE:     "${MLFLOW_MODEL_STAGE:-Production}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3000/health')\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
