services:

  # ── JupyterLab (datascience-notebook includes Python, R, Julia) ─────────────
  jupyterlab:
    image: ${JUPYTER_IMAGE:-jupyter/datascience-notebook:latest}
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-changeme}
      JUPYTER_ENABLE_LAB: "yes"
      CHOWN_HOME: "yes"
      GRANT_SUDO: "yes"
      # MLflow and MinIO reachable from inside the container via host.docker.internal.
      # On Linux, extra_hosts below maps that name to the host gateway.
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://host.docker.internal:5000}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://host.docker.internal:9000}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux fix; no-op on Docker Desktop
    user: root
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - workspace:/home/jovyan/work
      - ../../notebooks:/home/jovyan/notebooks:ro   # repo notebooks, read-only
    restart: unless-stopped

volumes:
  workspace:
