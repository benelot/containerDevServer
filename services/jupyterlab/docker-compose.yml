services:

  # ── JupyterLab (datascience-notebook includes Python, R, Julia) ─────────────
  jupyterlab:
    image: ${JUPYTER_IMAGE:-jupyter/datascience-notebook:latest}
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-changeme}
      JUPYTER_ENABLE_LAB: "yes"
      CHOWN_HOME: "yes"
      GRANT_SUDO: "yes"
    user: root
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - workspace:/home/jovyan/work
    restart: unless-stopped

volumes:
  workspace:
